name: ML Service CI

on:
  push:
    branches:
      - main
      - develop
      - development
      - muditha/CloudAMQP
      - muditha_CloudAMQP
      - Muditha
      - deployment
  pull_request:
    branches:
      - main
      - develop
      - development
      - muditha/CloudAMQP
      - muditha_CloudAMQP
      - Muditha
      - deployment

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          RABBITMQ_ENABLED: 'false'
        run: |
          pytest -v
